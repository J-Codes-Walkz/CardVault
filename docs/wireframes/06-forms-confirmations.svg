<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" role="img" aria-labelledby="t d"><title id="t">Forms and confirmations wireframe</title><desc id="d">The add/edit form for a My Cards entry, a delete confirmation, and the message styles.</desc><rect x="0" y="0" width="1000" height="760" rx="0" fill="#ffffff"/><text x="20" y="28" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" text-anchor="start" fill="#222222">Wireframe 06: Forms &amp; confirmations</text><text x="20" y="48" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#666666">Route: /cards/&lt;id&gt;/add/, /cards/mine/&lt;id&gt;/edit/, /cards/mine/&lt;id&gt;/delete/     Blue tags = user stories (see docs/user-stories.md)     Grey boxes = placeholders</text><rect x="20" y="64" width="960" height="644" rx="0" fill="none" stroke="#333333" stroke-width="1.5"/><rect x="20" y="64" width="960" height="56" rx="0" fill="#efefef" stroke="#333333" stroke-width="1.5"/><rect x="36" y="74" width="120" height="36" rx="4" fill="#d9d9d9" stroke="#777" stroke-width="1.2"/><text x="96" y="97" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">CardVault</text><text x="180" y="97" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#222222">Browse cards</text><text x="310.0" y="97" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#222222">My Cards</text><text x="868" y="97" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#222222">Logged in as jamie</text><rect x="880" y="76" width="84" height="32" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1.5"/><text x="922.0" y="97.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#222222">Log out</text><text x="60" y="160" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#222222">Add / edit a card entry</text><rect x="330" y="142" width="46" height="20" rx="10" fill="#1a5fb4" stroke="#1a5fb4" stroke-width="1"/><text x="353.0" y="156" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff">US11</text><rect x="388" y="142" width="46" height="20" rx="10" fill="#1a5fb4" stroke="#1a5fb4" stroke-width="1"/><text x="411.0" y="156" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff">US13</text><text x="60" y="190" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#666666">Card: Charizard (Base Set)</text><text x="60" y="224" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#666666">Status</text><rect x="60" y="232" width="110" height="36" rx="4" fill="#1a5fb4" stroke="#1a5fb4" stroke-width="1.5"/><text x="115.0" y="255.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Owned</text><rect x="180" y="232" width="110" height="36" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1.5"/><text x="235.0" y="255.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#222222">Wanted</text><text x="60" y="292" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#666666">Quantity</text><rect x="60" y="300" width="120" height="34" rx="3" fill="#fff" stroke="#555555" stroke-width="1"/><text x="220" y="292" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#666666">Notes (optional)</text><rect x="220" y="300" width="300" height="34" rx="3" fill="#fff" stroke="#555555" stroke-width="1"/><rect x="560" y="224" width="340" height="78" rx="0" fill="#eaf2fc" stroke="#1a5fb4" stroke-width="1" stroke-dasharray="5 4"/><text x="570" y="243" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1a5fb4" font-style="italic">Duplicate error: "You already have &lt;Card&gt; on</text><text x="570" y="259" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1a5fb4" font-style="italic">your list. Edit that entry to change it."</text><text x="570" y="275" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1a5fb4" font-style="italic">Quantity ≤ 0 shows a validation error.</text><rect x="60" y="356" width="140" height="40" rx="4" fill="#1a5fb4" stroke="#1a5fb4" stroke-width="1.5"/><text x="130.0" y="381.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Save</text><rect x="216" y="356" width="110" height="40" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1.5"/><text x="271.0" y="381.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#222222">Cancel</text><line x1="60" y1="424" x2="940" y2="424" stroke="#999999" stroke-width="1"/><text x="60" y="456" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#222222">Remove confirmation</text><rect x="330" y="438" width="46" height="20" rx="10" fill="#1a5fb4" stroke="#1a5fb4" stroke-width="1"/><text x="353.0" y="452" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff">US14</text><rect x="60" y="476" width="500" height="80" rx="6" fill="#f7f7f7" stroke="#777777" stroke-width="1"/><text x="76" y="500" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#222222">Remove Charizard from your cards?</text><text x="76" y="522" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#666666">This cannot be undone.</text><rect x="76" y="532" width="100" height="34" rx="4" fill="#1a5fb4" stroke="#1a5fb4" stroke-width="1.5"/><text x="126.0" y="554.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Remove</text><rect x="188" y="532" width="100" height="34" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1.5"/><text x="238.0" y="554.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#222222">Cancel</text><line x1="60" y1="584" x2="940" y2="584" stroke="#999999" stroke-width="1"/><text x="60" y="616" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#222222">Message styles</text><rect x="260" y="598" width="46" height="20" rx="10" fill="#1a5fb4" stroke="#1a5fb4" stroke-width="1"/><text x="283.0" y="612" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff">US24</text><rect x="60" y="636" width="420" height="40" rx="0" fill="#f7f7f7" stroke="#555555" stroke-width="1.5"/><text x="104" y="661" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#222222">Success:</text><text x="174" y="661" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#222222">Your entry was updated.</text><rect x="500" y="636" width="420" height="40" rx="0" fill="#fdecec" stroke="#b3261e" stroke-width="1.5"/><text x="544" y="661" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#8c1d18">Error:</text><text x="596" y="661" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#8c1d18">Quantity must be at least 1.</text><rect x="20" y="708" width="960" height="52" rx="0" fill="#efefef" stroke="#333333" stroke-width="1.5"/><text x="500" y="739" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#666666">CardVault  |  Educational project, not affiliated with The Pokémon Company</text></svg>