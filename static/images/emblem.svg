<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" width="100" height="140">
    <!-- CardVault emblem: an original card back with a ship-wheel vault lock -->
    <defs>
        <linearGradient id="cv-back" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#1f4fa3"/>
            <stop offset="1" stop-color="#0e2a63"/>
        </linearGradient>
        <radialGradient id="cv-oval" cx="0.5" cy="0.45" r="0.6">
            <stop offset="0" stop-color="#16397f"/>
            <stop offset="1" stop-color="#0a1f4d"/>
        </radialGradient>
        <linearGradient id="cv-steel" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#f4f6fa"/>
            <stop offset="1" stop-color="#a9b4c7"/>
        </linearGradient>
    </defs>
    <rect x="3" y="3" width="94" height="134" rx="10" fill="#0b1d45"/>
    <rect x="7" y="7" width="86" height="126" rx="7" fill="url(#cv-back)"/>
    <path d="M7 40 C 30 22, 55 60, 93 30" fill="none" stroke="#3a6cc4" stroke-width="5" stroke-opacity="0.45"/>
    <path d="M7 104 C 40 80, 60 122, 93 96" fill="none" stroke="#3a6cc4" stroke-width="5" stroke-opacity="0.45"/>
    <path d="M7 70 C 25 55, 75 88, 93 66" fill="none" stroke="#5b8ad8" stroke-width="3" stroke-opacity="0.3"/>
    <ellipse cx="50" cy="70" rx="33" ry="44" fill="url(#cv-oval)" stroke="#f2c230" stroke-width="5"/>
    <g stroke="url(#cv-steel)" stroke-linecap="round">
        <line x1="50" y1="70" x2="50" y2="44" stroke-width="4"/>
        <line x1="50" y1="70" x2="50" y2="96" stroke-width="4"/>
        <line x1="50" y1="70" x2="27.5" y2="57" stroke-width="4"/>
        <line x1="50" y1="70" x2="72.5" y2="57" stroke-width="4"/>
        <line x1="50" y1="70" x2="27.5" y2="83" stroke-width="4"/>
        <line x1="50" y1="70" x2="72.5" y2="83" stroke-width="4"/>
    </g>
    <circle cx="50" cy="70" r="18" fill="none" stroke="url(#cv-steel)" stroke-width="5"/>
    <g fill="#f2c230">
        <circle cx="50" cy="44" r="4"/>
        <circle cx="50" cy="96" r="4"/>
        <circle cx="27.5" cy="57" r="4"/>
        <circle cx="72.5" cy="57" r="4"/>
        <circle cx="27.5" cy="83" r="4"/>
        <circle cx="72.5" cy="83" r="4"/>
    </g>
    <circle cx="50" cy="70" r="8" fill="url(#cv-steel)" stroke="#0b1d45" stroke-width="2"/>
    <circle cx="50" cy="70" r="3" fill="#0b1d45"/>
</svg>
