{% load card_extras %}
<fieldset class="field ball-picker-field">
    <legend>{{ field.label }}</legend>
    <p class="field-help" id="rating-help">Choose from 1 to 5 Poké Balls.</p>
    <div class="ball-picker">
        {% for choice in field %}
        <span class="ball-option">{{ choice.tag }}<label for="{{ choice.id_for_label }}" class="ball-choice">{% ball_icon %}<span class="visually-hidden">{{ choice.choice_label }}</span></label></span>
        {% endfor %}
    </div>
    {% for error in field.errors %}
    <p class="field-error"><strong>Error:</strong> {{ error }}</p>
    {% endfor %}
</fieldset>
